---
- name: Creating Files using Master Playbook
  hosts: all
  tasks:
    - name: Creating directory
      ansible.builtin.file:
        path: "{{ DIRECTORY }}"
        state: directory

    - name: Creating File
      ansible.builtin.file:
        path: "{{ FILE }}"
        state: touch

    - name: Copy the CONTENTS to_the /DIRECTORY/FILE
      ansible.builtin.copy:
        content: "{{ CONTENT }}"
        dest: "{{ DIRECTORY }}/{{ FILE }}"

