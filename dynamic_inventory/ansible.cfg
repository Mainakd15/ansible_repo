[defaults]
# Automatically target the dynamic inventory script
inventory = ./free-ldap.py

# Set the remote user to match your managed node configurations
remote_user = admin

# Disable host key checking to prevent interactive SSH confirmation prompts
host_key_checking = False

[privilege_escalation]
# Enable privilege escalation rules so playbooks can write to protected paths like /etc/
become = True
become_method = sudo
become_user = root
become_ask_pass = False
