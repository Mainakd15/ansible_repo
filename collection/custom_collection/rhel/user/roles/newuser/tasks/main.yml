---
# tasks file for newuser
- name: Read the user configuration file
  ansible.builtin.include_vars:
    file: users.conf
    name: system_users
  failed_when: false

# If include_vars expects pure YAML, an alternative approach using lookup:
- name: Load users data if stored as raw file
  ansible.builtin.set_fact:
    user_list: "{{ lookup('file', 'users.conf') | from_yaml }}"

- name: Ensure specified user groups exist
  ansible.builtin.group:
    name: "{{ item.split(',') | first }}"
    state: present
  loop: "{{ user_list | map(attribute='groups') | list }}"
  ignore_errors: yes

- name: Create users based on users.conf definitions
  ansible.builtin.user:
    name: "{{ item.username }}"
    groups: "{{ item.groups | default(omit) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    state: present
    append: yes
  loop: "{{ user_list }}"
